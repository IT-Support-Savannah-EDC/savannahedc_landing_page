<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6">Form Submissions Dashboard</h1>

        <!-- Controls -->
        <div class="flex gap-4 mb-6 items-center">
            <select id="formTypeFilter" class="border p-2 rounded">
                <option value="all">All Forms</option>
                <option value="kyc">Customer KYC</option>
                <option value="meter_request">Get a Meter</option>
                <option value="contact">Contact Us</option>
            </select>
            <button onclick="fetchData()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Filter</button>
            <button onclick="exportCSV()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 ml-auto">Export to CSV</button>
        </div>

        <!-- Data Table -->
        <div class="overflow-x-auto">
            <table class="table-auto w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="p-3 border">Date</th>
                        <th class="p-3 border">Type</th>
                        <th class="p-3 border">Data</th>
                        <th class="p-3 border">Attachments</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be injected here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentData = [];

        // Helper function to convert camelCase/snake_case to human readable headers
        function formatFieldName(key) {
            return key
                .replace(/([A-Z])/g, ' $1')
                .replace(/[_-]/g, ' ')
                .replace(/^./, str => str.toUpperCase())
                .trim();
        }

        // --- NIGERIAN TIMEZONE FORMATTER (WAT / Africa/Lagos) ---
        function formatNigerianDate(dateString) {
            if (!dateString) return 'N/A';
            
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString; // Fallback if parsing fails

            return date.toLocaleString('en-US', {
                timeZone: 'Africa/Lagos',
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            });
        }

        async function fetchData() {
            const formType = document.getElementById('formTypeFilter').value;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="4" class="p-3 text-center">Loading...</td></tr>';

            try {
                const response = await fetch(`/api/admin/submissions?formType=${formType}`);
                if (!response.ok) throw new Error("Network response was not ok");
                
                currentData = await response.json();
                renderTable(currentData);
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-red-600">Error: ${error.message}</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-3 text-center">No submissions found.</td></tr>';
                return;
            }

            data.forEach(row => {
                let payload = {};
                try {
                    payload = typeof row.payload === 'string' ? JSON.parse(row.payload) : (row.payload || {});
                } catch(e) {
                    payload = { raw: row.payload };
                }
                
                const readableData = Object.entries(payload)
                                    .map(([key, value]) => `<b>${formatFieldName(key)}:</b> ${value}`)
                                    .join('<br>');

                let attachmentHTML = "None";
                if (row.attachments) {
                    try {
                        const parsedAtt = typeof row.attachments === 'string' ? JSON.parse(row.attachments) : row.attachments;
                        const attList = Array.isArray(parsedAtt) ? parsedAtt : (parsedAtt ? [parsedAtt] : []);

                        if (attList.length > 0) {
                            const links = attList.map((att, index) => {
                                if (!att || !att.fileKey || att.fileKey === "undefined") return null;
                                
                                const safeKey = encodeURIComponent(att.fileKey);
                                const displayName = att.fileName || `Attachment ${index + 1}`;
                                return `<a href="/api/admin/attachment?fileKey=${safeKey}" target="_blank" class="text-blue-600 underline font-semibold block my-1 hover:text-blue-800">📎 ${displayName}</a>`;
                            }).filter(Boolean);

                            if (links.length > 0) {
                                attachmentHTML = links.join('');
                            }
                        }
                    } catch(e) {
                        console.error("Error parsing attachments for row:", row.id, e);
                    }
                }

                // --- UPDATED DATE DISPLAY IN WAT ---
                const formattedDate = formatNigerianDate(row.submitted_at);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 border align-top whitespace-nowrap text-xs text-gray-700">${formattedDate}</td>
                    <td class="p-3 border align-top font-semibold capitalize text-sm">${row.form_type ? row.form_type.replace(/_/g, ' ') : ''}</td>
                    <td class="p-3 border align-top text-xs leading-relaxed">${readableData}</td>
                    <td class="p-3 border align-top text-xs min-w-[200px]">${attachmentHTML}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exportCSV() {
            if (!currentData || currentData.length === 0) return alert("No data to export!");

            const dynamicKeys = [];
            currentData.forEach(row => {
                try {
                    const payload = typeof row.payload === 'string' ? JSON.parse(row.payload) : (row.payload || {});
                    Object.keys(payload).forEach(key => {
                        if (!dynamicKeys.includes(key)) {
                            dynamicKeys.push(key);
                        }
                    });
                } catch (e) {}
            });

            const fixedHeaders = ["Ticket ID", "Submission Date (WAT)", "Form Type", "Attachment Links"];
            const dynamicHeaders = dynamicKeys.map(key => formatFieldName(key));
            const allHeaders = [...fixedHeaders, ...dynamicHeaders];

            const escapeCSV = (val) => {
                if (val === null || val === undefined) return '""';
                const strVal = String(val).replace(/\r?\n|\r/g, ' ');
                return `"${strVal.replace(/"/g, '""')}"`;
            };

            const rows = [];
            rows.push(allHeaders.map(escapeCSV).join(','));

            currentData.forEach(row => {
                let payload = {};
                try {
                    payload = typeof row.payload === 'string' ? JSON.parse(row.payload) : (row.payload || {});
                } catch (e) {}

                let attachmentUrls = "None";
                if (row.attachments) {
                    try {
                        const parsedAtt = typeof row.attachments === 'string' ? JSON.parse(row.attachments) : row.attachments;
                        const attList = Array.isArray(parsedAtt) ? parsedAtt : (parsedAtt ? [parsedAtt] : []);

                        const urls = attList
                            .filter(att => att && att.fileKey && att.fileKey !== "undefined")
                            .map(att => `${window.location.origin}/api/admin/attachment?fileKey=${encodeURIComponent(att.fileKey)}`);

                        if (urls.length > 0) {
                            attachmentUrls = urls.join(" ; ");
                        }
                    } catch(e) {}
                }

                // --- UPDATED CSV DATE IN WAT ---
                const formattedDate = formatNigerianDate(row.submitted_at);
                const formattedType = row.form_type ? row.form_type.replace(/_/g, ' ') : '';

                const rowData = [
                    row.id || '',
                    formattedDate,
                    formattedType,
                    attachmentUrls
                ];

                dynamicKeys.forEach(key => {
                    const val = (payload[key] !== undefined && payload[key] !== null) ? payload[key] : '';
                    rowData.push(val);
                });

                rows.push(rowData.map(escapeCSV).join(','));
            });

            const csvString = rows.join('\n');
            const blob = new Blob(["\uFEFF" + csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            const filename = `submissions_export_${new Date().toISOString().split('T')[0]}.csv`;
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        window.onload = fetchData;
    </script>
</body>
</html>
